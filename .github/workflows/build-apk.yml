name: Build DLMS 2-Way APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 Platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare ephemeral debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run DSP Unit Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.DspProcessorTest" --tests "com.example.ExampleUnitTest"

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare release signing configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using repository release keystore from GitHub Secrets."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Release keystore secrets not set; generating ephemeral CI keystore for release APK."
            EPHEMERAL_PW="ci-$(date +%s)-dlms"
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -storepass "$EPHEMERAL_PW" \
              -alias upload \
              -keypass "$EPHEMERAL_PW" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -dname "CN=DLMS 2-Way CI,O=DLMS,C=ID"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PW" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: gradle :app:assembleRelease

      - name: Package APK artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/dlms-2way-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/dlms-2way-release.apk
          ls -lh release-artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlms-2way-debug-apk
          path: release-artifacts/dlms-2way-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlms-2way-release-apk
          path: release-artifacts/dlms-2way-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/dlms-2way-debug.apk
            release-artifacts/dlms-2way-release.apk
          generate_release_notes: true
